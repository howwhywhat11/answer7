spring:
  application:
    name: number5
  datasource:
    url: jdbc:mysql://localhost:3306/test_db?useSSL=false&serverTimezone=UTC&characterEncoding=utf8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

user:
  usernamePattern: "^[a-zA-Z0-9]{3,10}$"
  passwordMinLength: 6
  #选择加密方式，提供了BCRYPT加密和MD5加密两种格式
  encrypt-algorithm: MD5
